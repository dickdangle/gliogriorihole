<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🦑 球核 SPHERA ROOT — SEED v2</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #08000f;
            color: #ccc;
            font-family: 'JetBrains Mono', monospace;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        #canvas {
            flex: 1;
            display: block;
            width: 100%;
            background: #08000f;
            cursor: grab;
        }
        #controls {
            background: #0a0018;
            border-top: 1px solid #2a1a3e;
            padding: 8px 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            font-size: 12px;
        }
        input, button, textarea {
            background: #0d0018;
            border: 1px solid #2a1a3e;
            color: #ccc;
            padding: 4px 8px;
            border-radius: 4px;
            font-family: inherit;
            font-size: 12px;
        }
        button {
            background: #1a0a2e;
            border-color: #a78bfa;
            color: #a78bfa;
            cursor: pointer;
        }
        button:hover {
            background: #2a1a3e;
        }
        #status {
            margin-left: auto;
            display: flex;
            gap: 12px;
            color: #a78bfa;
        }
        #exportArea {
            position: fixed;
            bottom: 70px;
            right: 20px;
            width: 400px;
            background: #0a0018;
            border: 1px solid #34d399;
            border-radius: 6px;
            padding: 10px;
            display: none;
            z-index: 100;
        }
        #exportArea textarea {
            width: 100%;
            height: 150px;
            background: #080010;
            border-color: #34d399;
            margin-bottom: 8px;
            resize: vertical;
        }
        .small {
            font-size: 10px;
            color: #666;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <div id="controls">
        <input type="text" id="wordInput" placeholder="speak a word..." />
        <button id="speakBtn">TICK</button>
        <span class="small">or press Enter</span>

        <input type="text" id="noteInput" placeholder="note: wordA wordB" />
        <button id="noteBtn">➕ NOTE</button>

        <button id="exportBtn">📤 EXPORT</button>
        <button id="importBtn">📥 IMPORT</button>

        <div id="status">
            <span id="tickDisplay">tick: 0</span>
            <span id="sphereCount">⚪ 0</span>
            <span id="stateDisplay">blind</span>
        </div>
    </div>

    <div id="exportArea">
        <textarea id="exportData" placeholder="Kernel JSON..."></textarea>
        <button id="copyBtn">📋 COPY</button>
        <button id="closeExport">✕</button>
        <div class="small">paste JSON and click outside to import</div>
    </div>

    <script>
        // ====================== SPHERA SEED v2 ======================
        class SpheraSeed {
            constructor() {
                this.root = [0, 0, 0];
                this.spheres = {};       // word → sphere object
                this.tick = 0;
                this.G = 0.12;
                this.damping = 0.92;
            }

            // Generate a deterministic color from word
            _wordColor(word) {
                let hash = 0;
                for (let i = 0; i < word.length; i++) {
                    hash = ((hash << 5) - hash) + word.charCodeAt(i) | 0;
                }
                return `hsl(${Math.abs(hash % 360)}, 70%, 60%)`;
            }

            speak(word) {
                word = word.toLowerCase().trim();
                if (!word) return;
                this.tick++;

                if (!this.spheres[word]) {
                    // Birth
                    let h = 0;
                    for (let i = 0; i < word.length; i++) {
                        h = ((h << 5) - h) + word.charCodeAt(i) | 0;
                    }
                    this.spheres[word] = {
                        mentions: 1,
                        pos: [
                            Math.sin(this.tick * 0.7 + h) * 7,
                            Math.cos(this.tick * 0.4 + h) * 7,
                            Math.sin(this.tick * 0.25 + h * 1.618) * 7
                        ],
                        vel: [0, 0, 0],
                        friends: {},        // word -> strength
                        born: this.tick,
                        lastTick: this.tick,
                        color: this._wordColor(word)
                    };
                } else {
                    const s = this.spheres[word];
                    s.mentions++;
                    s.lastTick = this.tick;
                }

                // After speaking, automatically note co-occurrence with other words spoken in last 3 ticks?
                // We'll let user add notes manually for now.
                this.stepPhysics();
                return this.spheres[word];
            }

            noteCoOccurrence(wordA, wordB) {
                wordA = wordA.toLowerCase().trim();
                wordB = wordB.toLowerCase().trim();
                if (wordA === wordB || !this.spheres[wordA] || !this.spheres[wordB]) return;
                const a = this.spheres[wordA];
                const b = this.spheres[wordB];
                const timeGap = Math.abs(a.lastTick - b.lastTick);
                if (timeGap <= 6) {
                    a.friends[wordB] = (a.friends[wordB] || 0) + 1;
                    b.friends[wordA] = (b.friends[wordA] || 0) + 1;
                }
            }

            stepPhysics() {
                const all = Object.values(this.spheres);

                all.forEach(s => {
                    let fx = 0, fy = 0, fz = 0;

                    // Gentle pull toward root
                    const dxr = this.root[0] - s.pos[0];
                    const dyr = this.root[1] - s.pos[1];
                    const dzr = this.root[2] - s.pos[2];
                    const distr = Math.sqrt(dxr*dxr + dyr*dyr + dzr*dzr) || 1;
                    const rootPull = 0.018 * (1 - Math.exp(-s.mentions / 6));
                    fx += dxr / distr * rootPull;
                    fy += dyr / distr * rootPull;
                    fz += dzr / distr * rootPull;

                    // Gravitational pulls from friends
                    Object.entries(s.friends).forEach(([friendName, strength]) => {
                        const f = this.spheres[friendName];
                        if (!f) return;

                        const dx = f.pos[0] - s.pos[0];
                        const dy = f.pos[1] - s.pos[1];
                        const dz = f.pos[2] - s.pos[2];
                        let dist2 = dx*dx + dy*dy + dz*dz;
                        if (dist2 < 0.01) dist2 = 0.01;

                        const force = this.G * strength / dist2;
                        fx += dx * force;
                        fy += dy * force;
                        fz += dz * force;
                    });

                    // Apply force to velocity
                    s.vel[0] += fx;
                    s.vel[1] += fy;
                    s.vel[2] += fz;

                    // Damping
                    s.vel[0] *= this.damping;
                    s.vel[1] *= this.damping;
                    s.vel[2] *= this.damping;

                    // Update position
                    s.pos[0] += s.vel[0];
                    s.pos[1] += s.vel[1];
                    s.pos[2] += s.vel[2];
                });
            }

            // Serialize to plain object (for JSON)
            toJSON() {
                return {
                    tick: this.tick,
                    G: this.G,
                    damping: this.damping,
                    spheres: this.spheres
                };
            }

            // Deserialize and revive prototypes
            static fromJSON(obj) {
                const seed = new SpheraSeed();
                seed.tick = obj.tick || 0;
                seed.G = obj.G || 0.12;
                seed.damping = obj.damping || 0.92;
                seed.spheres = {};
                // Reconstruct spheres, preserving data but not methods (they're plain objects)
                Object.entries(obj.spheres || {}).forEach(([word, s]) => {
                    seed.spheres[word] = {
                        ...s,
                        // Ensure arrays are arrays
                        pos: s.pos.slice(),
                        vel: s.vel.slice(),
                        friends: { ...s.friends },
                        // Re-add methods? No, they're data only; methods come from class.
                        // But we need the color for rendering – store it or recompute.
                        color: seed._wordColor(word)
                    };
                });
                return seed;
            }

            // For status
            getSphereCount() {
                return Object.keys(this.spheres).length;
            }

            getState() {
                return this.tick >= 30 ? 'sighted' : 'blind';
            }
        }

        // ====================== VISUALIZATION ======================
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Kernel instance
        let kernel = new SpheraSeed();

        // Project 3D to 2D
        function project(x, y, z) {
            const scale = 300 / (300 + z + 10); // perspective factor
            return {
                x: canvas.width/2 + x * 25 * scale,
                y: canvas.height/2 - y * 25 * scale,
                scale: scale
            };
        }

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);

            // Step physics (but not too fast – limit steps per frame)
            // We'll step once per frame; smooth enough.
            kernel.stepPhysics();

            ctx.fillStyle = '#08000f';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const spheres = Object.values(kernel.spheres);

            // Draw connections (friends with strength >= 1)
            ctx.lineWidth = 1.2;
            spheres.forEach(a => {
                Object.entries(a.friends).forEach(([bWord, strength]) => {
                    const b = kernel.spheres[bWord];
                    if (!b || a === b) return;
                    // Only draw each pair once (avoid double)
                    if (a.word < bWord) return; // we'll iterate all, but skip half
                    // Actually we need to ensure we draw only once; we'll use a set
                });
            });
            // Better: use a set to avoid duplicates
            const drawnPairs = new Set();
            spheres.forEach(a => {
                Object.entries(a.friends).forEach(([bWord, strength]) => {
                    const b = kernel.spheres[bWord];
                    if (!b) return;
                    const pairId = [a.word, bWord].sort().join('|');
                    if (drawnPairs.has(pairId)) return;
                    drawnPairs.add(pairId);

                    const p1 = project(a.pos[0], a.pos[1], a.pos[2]);
                    const p2 = project(b.pos[0], b.pos[1], b.pos[2]);
                    const alpha = Math.min(strength / 10, 0.6) * 0.5;
                    ctx.strokeStyle = `rgba(167, 139, 250, ${alpha})`;
                    ctx.beginPath();
                    ctx.moveTo(p1.x, p1.y);
                    ctx.lineTo(p2.x, p2.y);
                    ctx.stroke();
                });
            });

            // Draw spheres
            spheres.forEach(s => {
                const p = project(s.pos[0], s.pos[1], s.pos[2]);
                const r = (3 + Math.log(s.mentions) * 3) * p.scale;

                // Glow
                const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r*3);
                grad.addColorStop(0, s.color + '80');
                grad.addColorStop(1, s.color + '00');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(p.x, p.y, r*3, 0, Math.PI*2);
                ctx.fill();

                // Core
                ctx.fillStyle = s.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, r, 0, Math.PI*2);
                ctx.fill();

                // Word label (if enough space)
                if (p.scale > 0.2) {
                    ctx.fillStyle = '#fff';
                    ctx.font = `${Math.max(8, Math.floor(11 * p.scale))}px monospace`;
                    ctx.textAlign = 'center';
                    ctx.fillText(s.word, p.x, p.y - r - 4);
                }
            });

            // Draw root marker
            const root = project(0, 0, 0);
            ctx.fillStyle = '#f59e0b';
            ctx.beginPath();
            ctx.arc(root.x, root.y, 6, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.font = '9px monospace';
            ctx.fillText('⚛', root.x - 3, root.y - 10);

            // Update status display
            document.getElementById('tickDisplay').innerText = `tick: ${kernel.tick}`;
            document.getElementById('sphereCount').innerText = `⚪ ${kernel.getSphereCount()}`;
            document.getElementById('stateDisplay').innerText = kernel.getState();
        }
        animate();

        // ====================== UI CONTROLS ======================
        const wordInput = document.getElementById('wordInput');
        const speakBtn = document.getElementById('speakBtn');
        const noteInput = document.getElementById('noteInput');
        const noteBtn = document.getElementById('noteBtn');
        const exportBtn = document.getElementById('exportBtn');
        const importBtn = document.getElementById('importBtn');
        const exportArea = document.getElementById('exportArea');
        const exportData = document.getElementById('exportData');
        const copyBtn = document.getElementById('copyBtn');
        const closeExport = document.getElementById('closeExport');

        function speak() {
            const word = wordInput.value.trim();
            if (word) {
                kernel.speak(word);
                wordInput.value = '';
            }
        }

        wordInput.addEventListener('keydown', e => {
            if (e.key === 'Enter') speak();
        });
        speakBtn.addEventListener('click', speak);

        noteBtn.addEventListener('click', () => {
            const val = noteInput.value.trim();
            const parts = val.split(/\s+/);
            if (parts.length >= 2) {
                kernel.noteCoOccurrence(parts[0], parts[1]);
                noteInput.value = '';
            }
        });

        exportBtn.addEventListener('click', () => {
            const json = JSON.stringify(kernel.toJSON(), null, 2);
            exportData.value = json;
            exportArea.style.display = 'block';
        });

        closeExport.addEventListener('click', () => {
            exportArea.style.display = 'none';
        });

        copyBtn.addEventListener('click', () => {
            exportData.select();
            document.execCommand('copy');
        });

        importBtn.addEventListener('click', () => {
            exportArea.style.display = 'block';
            exportData.value = ''; // clear for paste
        });

        // When focus leaves exportArea, try to import
        exportArea.addEventListener('blur', (e) => {
            // Wait a bit to allow copy button clicks
            setTimeout(() => {
                if (!exportArea.contains(document.activeElement)) {
                    tryImport();
                }
            }, 200);
        }, true);

        function tryImport() {
            const text = exportData.value.trim();
            if (!text) return;
            try {
                const obj = JSON.parse(text);
                kernel = SpheraSeed.fromJSON(obj);
                exportArea.style.display = 'none';
            } catch (e) {
                alert('Invalid JSON');
            }
        }

        // Also allow manual import via button
        // We'll add a small "load" button inside exportArea? For simplicity, we'll keep blur.
        // But we also want a manual load: add a button
        const loadBtn = document.createElement('button');
        loadBtn.textContent = 'LOAD';
        loadBtn.style.marginLeft = '8px';
        loadBtn.addEventListener('click', tryImport);
        exportArea.appendChild(loadBtn);

        // Also handle escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') exportArea.style.display = 'none';
        });

        // Initialize with a demo word to see something
        setTimeout(() => {
            kernel.speak('root');
            kernel.speak('seed');
            kernel.noteCoOccurrence('root', 'seed');
        }, 100);
    </script>
</body>
</html>
