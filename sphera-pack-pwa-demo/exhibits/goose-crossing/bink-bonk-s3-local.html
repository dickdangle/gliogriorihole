<!doctype html>
<html lang="en">
<head>

</head>
<body class="listen">
  <canvas id="world" aria-label="Interactive token physics and goose biome on the three-sphere"></canvas>
  <div class="top">
    <div class="brand"><b>SpherAI</b> / S<sup>3</sup> <span id="modeName">listen</span> +</div>
    <div class="status"><span id="readout">12 points / 7 Q₈ gice / 0 bonks / S³</span><button id="sound" class="primary">awaken sound</button><button id="mode">reveal Hopf [V]</button></div>
  </div>
  <div class="hint">move with WASD or touch · every action returns a receipt</div>
  <div class="action-dock" aria-label="Touch actions"><button id="ping">ping</button><button id="pulse">pulse</button><button id="cool">cool</button><button id="honk">honk</button></div>
  <div class="knot-signal" id="knotSignal" hidden><b id="knotName">KNOT SIGNAL</b><span id="knotEffect"></span></div>
  <div class="manifold"><b>QUA(WA)TERNION GICE / Q₈∖{+1}</b><code>720° = 1 winding · 1.000000000 = 0′</code><span>fill = condensed gas fraction φ · η = element viscosity · plane = selected quaternion axis</span></div>
  <div class="dock">
    <label>points <output id="countOut">12</output><input id="count" type="range" min="4" max="32" value="12"></label>
    <label>coupling <output id="couplingOut">0.42</output><input id="coupling" type="range" min="0" max="100" value="42"></label>
    <label>bounce <output id="bounceOut">0.88</output><input id="bounce" type="range" min="20" max="100" value="88"></label>
    <label>slice axis <output id="sliceOut">w</output><select id="slice" aria-label="Quaternion slice axis"><option value="0">w / scalar</option><option value="1">x / i</option><option value="2">y / j</option><option value="3">z / k</option></select></label>
    <button id="scatter">scatter tangent vectors</button>
  </div>
<script>
(() => {

  let w=0,h=0,dpr=1,last=performance.now(),visual=false,bonks=0,quawaps=0,flash=0,sliceAxis=0,audio=null,master=null,echo=null,echoGain=null,nextBeacon=0,lastTelemetry=0,lastStateEmission=0,cameraPhase=0,rngState=0x6d2b79f5,rngSeed='sphera-local-default',pointer={x:0,y:0,down:false,q:null},keys={},waves=[],particles=[];

  function seedHash(value){let h=2166136261;for(const ch of String(value)){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}

  const rand=(a,b)=>a+random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

  const qmul=(a,b)=>[a[0]*b[0]-a[1]*b[1]-a[2]*b[2]-a[3]*b[3],a[0]*b[1]+a[1]*b[0]+a[2]*b[3]-a[3]*b[2],a[0]*b[2]-a[1]*b[3]+a[2]*b[0]+a[3]*b[1],a[0]*b[3]+a[1]*b[2]-a[2]*b[1]+a[3]*b[0]];

  function direction(a,b){const c=dot(a,b),v=b.map((x,i)=>x-c*a[i]),n=norm(v);return n<1e-7?[0,0,0,0]:v.map(x=>x/n)}

  function camera3(v,time){const yaw=time*.000055,pitch=.32+Math.sin(time*.000031)*.12,cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch),x=cy*v[0]+sy*v[2],z=-sy*v[0]+cy*v[2],y=cp*v[1]-sp*z;return[x,y,sp*v[1]+cp*z]}

  function projectAll(time,dt){points.forEach(p=>project(p,time,dt));geese.forEach(g=>project(g,time,dt));project(listener,time,dt)}
  function screenToS3(x,y){const chi=clamp(y/h,0,1)*Math.PI,theta=clamp(x/w,0,1)*Math.PI*2,psi=cameraPhase;return unit([Math.cos(chi),Math.sin(chi)*Math.cos(theta),Math.sin(chi)*Math.sin(theta)*Math.cos(psi),Math.sin(chi)*Math.sin(theta)*Math.sin(psi)])}
  function makePoint(i){const q=randomQ(),r=rand(4,9);return{q,v:randomTangent(q,rand(.08,.32)),x:0,y:0,px:0,py:0,vx:0,vy:0,depth:0,fiber:0,r,m:r*r*.08,kind:i%palette.length,color:palette[i%palette.length],trail:[],cooldown:0,qCooldown:0}}

  function makeGoose(i){const q=randomQ(),member=Q8[i%Q8.length],gasMoles=.42+(1-member.viscosity)*.46,temperature=.52+rand(-.04,.08),level=.22+member.viscosity*.28;return{q,v:randomTangent(q,rand(.04,.16)),operator:member.q,name:member.name,element:member.element,viscosity:member.viscosity,liquid:member.liquid,gasMoles,temperature,pressure:gasMoles*temperature/(1-level),level,targetLevel:level,rotationTravel:0,windingCount:0,windingPhase:0,x:0,y:0,px:0,py:0,vx:0,vy:0,depth:0,fiber:0,renderScale:1,angle:0,phase:rand(0,Math.PI*2),r:18+rand(0,7),honk:0,index:i}}

  function reset(){points.length=0;geese.length=0;setPointCount(+ui.count.value);for(let i=0;i<7;i++)geese.push(makeGoose(i));listener.q=[1,0,0,0];listener.v=[0,0,0,0];listener.score=0;bonks=0;quawaps=0;waves=[];projectAll(performance.now(),1/60);bridge('biome.reset',{points:points.length,gice:geese.length,manifold:'S3',operators:'Q8\\{+1}'})}
  function stateSnapshot(){return{schema:'goose.crossing.biome-state/1',seed:rngSeed,rngState:rngState>>>0,controls:{count:+ui.count.value,coupling:+ui.coupling.value/100,bounce:+ui.bounce.value/100,sliceAxis,visual},counters:{bonks,quawaps,found:listener.score},listener:{q:listener.q.slice(),v:listener.v.slice(),score:listener.score},points:points.map(p=>({q:p.q.slice(),v:p.v.slice(),r:p.r,m:p.m,kind:p.kind,color:p.color,cooldown:p.cooldown,qCooldown:p.qCooldown})),geese:geese.map(g=>({q:g.q.slice(),v:g.v.slice(),gasMoles:g.gasMoles,temperature:g.temperature,pressure:g.pressure,level:g.level,targetLevel:g.targetLevel,rotationTravel:g.rotationTravel,windingCount:g.windingCount,windingPhase:g.windingPhase,r:g.r,honk:g.honk}))}}
  function restoreState(state){if(!state||state.schema!=='goose.crossing.biome-state/1')return false;setSeed(state.seed);const savedRngState=Number(state.rngState)>>>0;rngState=savedRngState;const controls=state.controls||{};ui.count.value=String(clamp(Number(controls.count)||12,4,32));ui.countOut.value=ui.count.value;ui.coupling.value=String(clamp(Math.round((Number(controls.coupling)||.42)*100),0,100));ui.couplingOut.value=(+ui.coupling.value/100).toFixed(2);ui.bounce.value=String(clamp(Math.round((Number(controls.bounce)||.88)*100),20,100));ui.bounceOut.value=(+ui.bounce.value/100).toFixed(2);sliceAxis=clamp(Number(controls.sliceAxis)||0,0,3);ui.slice.value=String(sliceAxis);ui.sliceOut.value=AXES[sliceAxis];visual=Boolean(controls.visual);document.body.classList.toggle('listen',!visual);ui.modeName.textContent=visual?'Hopf reveal':'listen';points.length=0;(state.points||[]).forEach((saved,i)=>{const p=makePoint(i);Object.assign(p,saved,{q:saved.q.slice(),v:saved.v.slice(),trail:[]});points.push(p)});geese.length=0;(state.geese||[]).forEach((saved,i)=>{const g=makeGoose(i);Object.assign(g,saved,{q:saved.q.slice(),v:saved.v.slice()});geese.push(g)});if(!points.length||!geese.length)return false;rngState=savedRngState;Object.assign(listener,state.listener||{});listener.q=(state.listener?.q||[1,0,0,0]).slice();listener.v=(state.listener?.v||[0,0,0,0]).slice();bonks=Number(state.counters?.bonks)||0;quawaps=Number(state.counters?.quawaps)||0;listener.score=Number(state.counters?.found)||0;waves=[];particles=[];last=performance.now();projectAll(last,1/60);bridge('biome.restored',{seed:rngSeed,points:points.length,gice:geese.length});return true}

  function wake(){const first=!audio;if(!audio){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;audio=new AC();master=audio.createGain();master.gain.value=.34;const comp=audio.createDynamicsCompressor();comp.threshold.value=-18;comp.knee.value=14;comp.ratio.value=5;echo=audio.createDelay(.8);echo.delayTime.value=.19;echoGain=audio.createGain();echoGain.gain.value=.16;const wet=audio.createGain();wet.gain.value=.22;master.connect(comp);master.connect(echo);echo.connect(echoGain);echoGain.connect(echo);echo.connect(wet);wet.connect(comp);comp.connect(audio.destination)}if(audio.state==='suspended')audio.resume();document.body.classList.add('awake');ui.sound.textContent='sound on';ui.sound.classList.remove('primary');if(first){tone(110,-.2,.32,.08,'sine',0,2);tone(220,.2,.4,.055,'triangle',.06,1.5);tone(329.63,0,.5,.035,'sine',.13,1.25)}}

  function burst(x,y,color,count=10,energy=1){for(let i=0;i<count;i++){const a=rand(0,Math.PI*2),s=rand(18,105)*energy;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(.45,1),size:rand(1,3.4),color})}if(particles.length>420)particles.splice(0,particles.length-420)}
